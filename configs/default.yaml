project:
  name: GalaxyLens-Robust
  seed: 42
  target: original_10_class
  image_size: 224
  num_classes: 10

data:
  hdf5_path: data/raw/Galaxy10_DECals.h5
  split_path: data/splits/split_seed42.json
  train_fraction: 0.80
  validation_fraction: 0.10
  test_fraction: 0.10

training:
  epochs: 12
  batch_size: 32
  num_workers: 2
  learning_rate: 0.0003
  weight_decay: 0.0001
  pretrained: true
  quality_augmentation: false
  device: auto
  patience: 4

evaluation:
  confidence_threshold: null
  corruption_seed: 2026
