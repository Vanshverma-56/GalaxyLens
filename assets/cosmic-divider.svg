<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 36" width="1200" height="36" role="presentation">
  <defs>
    <linearGradient id="divLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050816" stop-opacity="0"/>
      <stop offset="18%" stop-color="#1E3A8A" stop-opacity="0.75"/>
      <stop offset="38%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#EC4899" stop-opacity="1"/>
      <stop offset="62%" stop-color="#8B5CF6" stop-opacity="0.95"/>
      <stop offset="82%" stop-color="#1E3A8A" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pulseOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="1"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Glowing Cosmic Line -->
  <line x1="40" y1="18" x2="1160" y2="18" stroke="url(#divLine)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Travelling Photon Pulse Left -> Right -->
  <ellipse cx="200" cy="18" rx="46" ry="3.5" fill="url(#pulseOrb)">
    <animate attributeName="cx" values="140;1060;140" dur="7s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Center Pulsar Diamond & Flanking Stars -->
  <circle cx="564" cy="18" r="2.2" fill="#38BDF8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <path d="M 600 7 L 603.5 14.5 L 611 18 L 603.5 21.5 L 600 29 L 596.5 21.5 L 589 18 L 596.5 14.5 Z" fill="#F472B6">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </path>
  <circle cx="600" cy="18" r="2.5" fill="#FFFFFF"/>
  <circle cx="636" cy="18" r="2.2" fill="#A855F7">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
