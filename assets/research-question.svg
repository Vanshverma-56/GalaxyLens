<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 196" width="1200" height="196" role="img" aria-label="Core Research Question Spotlight">
  <defs>
    <linearGradient id="rqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B1E"/>
      <stop offset="48%" stop-color="#0F1842"/>
      <stop offset="100%" stop-color="#210D3B"/>
    </linearGradient>
    <linearGradient id="rqBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="rqOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#6366F1" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#060B1E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="2" y="2" width="1196" height="192" rx="18" fill="url(#rqBg)" stroke="url(#rqBorder)" stroke-opacity="0.8" stroke-width="1.6"/>
  <circle cx="1065" cy="98" r="150" fill="url(#rqOrb)">
    <animate attributeName="r" values="135;165;135" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Left Glowing Accent Bar -->
  <rect x="34" y="32" width="5" height="132" rx="2.5" fill="url(#rqBorder)"/>

  <!-- Animated Orbital Icon on Right -->
  <g transform="translate(1082, 98)">
    <circle cx="0" cy="0" r="54" fill="none" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="6 6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="36" fill="none" stroke="#EC4899" stroke-opacity="0.55" stroke-width="1.6" stroke-dasharray="32 16">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#A855F7" stroke-opacity="0.45" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="7.5" fill="#F472B6">
      <animate attributeName="r" values="6;9;6" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="3.2" fill="#FFFFFF"/>
  </g>

  <!-- Text Content -->
  <g transform="translate(58, 44)">
    <text x="0" y="0" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="1.6">✦ CORE SCIENTIFIC HYPOTHESIS &amp; RESEARCH TARGET</text>
    <text x="0" y="38" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="700">“How does <tspan fill="#7DD3FC">image quality</tspan> affect galaxy-classifier predictions, and</text>
    <text x="0" y="69" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="700">can training with <tspan fill="#C084FC">realistic image-quality variation</tspan> plus</text>
    <text x="0" y="100" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="700"><tspan fill="#F472B6">uncertainty-based rejection</tspan> reduce unreliable classifications?”</text>
  </g>
</svg>
