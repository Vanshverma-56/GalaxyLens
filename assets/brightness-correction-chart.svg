  <!-- Caveat Footer -->
  <text x="36" y="324" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">
    Note: Recovered aggregate scores on frozen test split · Corrected severity-3 per-class metrics &amp; confusion matrix unavailable · Synthetic stress test only.
