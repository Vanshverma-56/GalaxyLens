<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 248" width="1200" height="248" role="img" aria-label="Scientific Guardrails Constellation Matrix">
  <defs>
    <linearGradient id="sgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050817"/>
      <stop offset="50%" stop-color="#0B1433"/>
      <stop offset="100%" stop-color="#190B32"/>
    </linearGradient>
    <linearGradient id="sgBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="1196" height="244" rx="18" fill="url(#sgBg)" stroke="url(#sgBorder)" stroke-opacity="0.72" stroke-width="1.6"/>

  <g transform="translate(36, 32)">
    <text x="0" y="0" fill="#F472B6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.5">⛨ NON-NEGOTIABLE EXPERIMENTAL INTEGRITY</text>
    <text x="0" y="23" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19.5" font-weight="700">Six Scientific Guardrails Enforced Across All Runs</text>
  </g>

  <!-- Row 1 (3 Cards: width=362, gap=21) -->
  <g transform="translate(36, 74)">
    <rect x="0" y="0" width="362" height="68" rx="12" fill="#0B1A3E" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.1"/>
    <circle cx="24" cy="24" r="4" fill="#38BDF8"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/></circle>
    <text x="38" y="28" fill="#7DD3FC" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">01 · NATIVE 10-CLASS TAXONOMY</text>
    <text x="20" y="50" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.2">Keep all 10 source labels (0–9); no silent remap.</text>
  </g>

  <g transform="translate(419, 74)">
    <rect x="0" y="0" width="362" height="68" rx="12" fill="#101843" stroke="#6366F1" stroke-opacity="0.55" stroke-width="1.1"/>
    <circle cx="24" cy="24" r="4" fill="#818CF8"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/></circle>
    <text x="38" y="28" fill="#A5B4FC" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">02 · FROZEN REPRODUCIBLE SPLIT</text>
    <text x="20" y="50" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.2">Freeze &amp; reuse one split across all comparisons.</text>
  </g>

  <g transform="translate(802, 74)">
    <rect x="0" y="0" width="362" height="68" rx="12" fill="#181242" stroke="#A855F7" stroke-opacity="0.55" stroke-width="1.1"/>
    <circle cx="24" cy="24" r="4" fill="#C084FC"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.1s" repeatCount="indefinite"/></circle>
    <text x="38" y="28" fill="#D8B4FE" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">03 · BEYOND RAW ACCURACY</text>
    <text x="20" y="50" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.2">Report macro-F1, per-class F1 &amp; confusion matrix.</text>
  </g>

  <!-- Row 2 (3 Cards) -->
  <g transform="translate(36, 156)">
    <rect x="0" y="0" width="362" height="68" rx="12" fill="#1B1240" stroke="#9333EA" stroke-opacity="0.55" stroke-width="1.1"/>
    <circle cx="24" cy="24" r="4" fill="#C084FC"><animate attributeName="opacity" values="1;0.4;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <text x="38" y="28" fill="#E9D5FF" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">04 · SYNTHETIC STRESS SCOPE</text>
    <text x="20" y="50" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.2">Controlled stress tests ≠ external survey proof.</text>
  </g>

  <g transform="translate(419, 156)">
    <rect x="0" y="0" width="362" height="68" rx="12" fill="#230F3D" stroke="#D946EF" stroke-opacity="0.55" stroke-width="1.1"/>
    <circle cx="24" cy="24" r="4" fill="#E879F9"><animate attributeName="opacity" values="1;0.4;1" dur="3.0s" repeatCount="indefinite"/></circle>
    <text x="38" y="28" fill="#F5D0FE" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">05 · HELD-OUT TEST DISCIPLINE</text>
    <text x="20" y="50" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.2">Choose checkpoints &amp; cutoffs on validation only.</text>
  </g>

  <g transform="translate(802, 156)">
    <rect x="0" y="0" width="362" height="68" rx="12" fill="#2B0E36" stroke="#EC4899" stroke-opacity="0.6" stroke-width="1.1"/>
    <circle cx="24" cy="24" r="4" fill="#F472B6"><animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <text x="38" y="28" fill="#FBCFE8" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">06 · EVIDENCE-FIRST CLAIMS</text>
    <text x="20" y="50" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.2">Claim no improvement until experiments show it.</text>
  </g>
</svg>
