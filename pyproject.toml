[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "galaxylens-robust"
version = "0.1.0"
description = "Reproducible robustness study for galaxy morphology classification"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "h5py>=3.9",
  "Pillow>=10.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "torch>=2.2",
  "torchvision>=0.17"
]

[project.optional-dependencies]
app = ["streamlit>=1.32"]
dev = ["pytest>=8.0", "ruff>=0.3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
